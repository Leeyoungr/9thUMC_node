/api/v1/users/signup:
  post:
    tags:
      - Users
    summary: 사용자 회원가입
    requestBody:
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/requestBodies/UserSignup"
    responses:
      "201":
        $ref: "./openapi.yaml#/components/responses/SuccessResponse"
      "400":
        $ref: "./openapi.yaml#/components/responses/BadRequest"

/api/v1/users/reviews:
  get:
    tags:
      - Users
    summary: 사용자 작성 리뷰 목록 조회
    responses:
      "200":
        $ref: "./openapi.yaml#/components/responses/SuccessListReviews"
      "401":
        $ref: "./openapi.yaml#/components/responses/Unauthorized"

/api/v1/users/missions:
  get:
    tags:
      - Users
    summary: 사용자 미션 목록 조회 (진행중/완료)
    responses:
      "200":
        $ref: "./openapi.yaml#/components/responses/SuccessUserMissions"
      "401":
        $ref: "./openapi.yaml#/components/responses/Unauthorized"
